name: Build & Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Downloadable build for every branch / PR (Actions run → Artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: brethren-of-the-coast-web
          path: dist
      # Pages artifact (only deployed from the default branch or manual runs).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires Settings → Pages → Source: "GitHub Actions". Until then this step is skipped over
      # (the built game is still available as a downloadable artifact from the build job).
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: echo "::warning::GitHub Pages is not enabled for this repository. Enable it under Settings → Pages → Source → GitHub Actions, then re-run this workflow."
      - if: steps.deployment.outcome == 'success'
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
